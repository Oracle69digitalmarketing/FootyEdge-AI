# FootyEdge AI — frontend build verification (no deploy, no secrets).
#
# Pushes to main (and PRs targeting main) get a clean, healthy-runner proof
# that `npm ci` + TypeScript + `vite build` succeed and emit a real bundle.
#
# NOTES:
# - `npx tsc --noEmit` is currently expected to report two PRE-EXISTING
#   errors (Portfolio/AccaBuilder prop contracts in src/App.tsx). They do not
#   block `vite build` (esbuild strips types without checking), so the
#   typecheck step is informational (`continue-on-error`) until those are
#   addressed in a separate objective. A failing typecheck must never be
#   misread as a failing production build.
# - No Supabase, Vite env secrets, migrations, or deployments here.

name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (informational; pre-existing errors documented above)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Production build
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test "$(find dist -type f -size +0c | wc -l)" -gt 0
          du -sh dist
          find dist -maxdepth 2 -type f | sort

      - name: Verify bundle contains the application (stub guard)
        # A stub bundle exits 0 but carries no app code. Fail unless the
        # entry chunk contains recognizable application strings.
        run: |
          grep -rl "FootyEdge" dist/assets/*.js | tee /tmp/app_chunks.txt
          test -s /tmp/app_chunks.txt
          grep -c "Owner Console" $(cat /tmp/app_chunks.txt | head -1)
          grep -c "Dashboard" $(cat /tmp/app_chunks.txt | head -1)

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footyedge-dist
          path: dist
          retention-days: 7

      - name: Diagnose entry chunk (first bytes only, no secrets)
        if: always()
        run: |
          ls -la dist/assets
          for f in dist/assets/index-*.js; do
            case "$f" in *vendor*|*chart*) continue;; esac
            echo "--- head of $f ---"
            head -c 600 "$f"
            echo
          done
