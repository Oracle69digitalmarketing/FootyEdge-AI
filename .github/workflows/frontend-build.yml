# FootyEdge AI — frontend build verification (no deploy, no secrets).
#
# Pushes to main (and PRs targeting main) get a clean, healthy-runner proof
# that `npm ci` + TypeScript + `vite build` succeed and emit a real bundle.
#
# NOTES:
# - `npx tsc --noEmit` is currently expected to report two PRE-EXISTING
#   errors (Portfolio/AccaBuilder prop contracts in src/App.tsx). They do not
#   block `vite build` (esbuild strips types without checking), so the
#   typecheck step is informational (`continue-on-error`) until those are
#   addressed in a separate objective. A failing typecheck must never be
#   misread as a failing production build.
# - No Supabase, Vite env secrets, migrations, or deployments here.

name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (informational; pre-existing errors documented above)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Production build
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test "$(find dist -type f -size +0c | wc -l)" -gt 0
          test "$(find dist/assets -name '*.js' -size +100k | wc -l)" -gt 0
          du -sh dist
          find dist -maxdepth 2 -type f | sort
