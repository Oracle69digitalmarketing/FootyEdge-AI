# FootyEdge AI — Supabase production migration workflow (TEMPLATE).
#
# Manual setup required before this deploys anything (see REQUIRED SECRETS
# and REQUIRED ENVIRONMENT below). Until then every production-touching step
# fails closed instead of targeting an unknown project.
#
# Intended architecture:
#   Pull Request -> tests/validation -> merge to main -> this workflow
#   -> Supabase CLI -> verified production project -> supabase db push
#
# REQUIRED SECRETS (repository Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - Supabase personal access token (CI use only).
#   SUPABASE_PROJECT_REF   - Verified FootyEdge production project ref.
#   SUPABASE_DB_PASSWORD   - Production database password for CLI linking.
#
# REQUIRED ENVIRONMENT (Settings -> Environments):
#   production             - With required reviewers, so `db push` needs an
#                            explicit human approval even after merge to main.
#
# SAFETY INVARIANTS (do not weaken without a reviewed objective):
#   - No `supabase db reset` (linked or otherwise), ever.
#   - No `--include-seed` against production.
#   - No `migration repair`, no ad-hoc SQL outside version-controlled files
#     under supabase/migrations/.
#   - No production data changes outside declared migrations.
#
# NOTE: the repository's migrations currently live in supabase_migrations/
# (manual SQL-Editor workflow). Do NOT point this workflow at production
# until they have been adopted into supabase/migrations/ AFTER the remote
# migration history is known (see Objective 6D-B report). The path below is
# intentionally inert until SUPABASE_MIGRATIONS_DIR exists.

name: supabase-migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

env:
  SUPABASE_MIGRATIONS_DIR: supabase/migrations

jobs:
  validate:
    name: validate migrations (offline + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fail closed when migration directory is absent
        run: |
          test -d "$SUPABASE_MIGRATIONS_DIR" || {
            echo "::notice::No $SUPABASE_MIGRATIONS_DIR yet; manual SQL-Editor workflow still authoritative."
            exit 0
          }

      - name: offline identity regression tests
        run: |
          python -m pytest tests/test_fixture_provenance.py \
            tests/test_competition_provenance.py \
            tests/test_provider_mappings.py \
            tests/test_competition_season_membership.py -q

      - name: static destructive-SQL guard
        run: |
          ! grep -rinE "^\s*(DROP\s+(TABLE|COLUMN)|DELETE\s+FROM|UPDATE\s+\w+\s+SET|ALTER\s+TABLE\s+\w+\s+(DROP|ALTER\s+COLUMN))" \
            "$SUPABASE_MIGRATIONS_DIR" --include="*.sql"

      - uses: supabase/setup-cli@v1
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
        with:
          version: latest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: link and dry-run (review before any real push)
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list
          supabase db push --dry-run

  deploy-production:
    name: deploy migrations to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - name: require configured production target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret missing."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF secret missing."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD secret missing."; exit 1; }
          test -d "$SUPABASE_MIGRATIONS_DIR" || { echo "::error::No version-controlled migration directory."; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: link to the explicitly configured production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list

      - name: push migrations (no seed, no reset, no repair)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
