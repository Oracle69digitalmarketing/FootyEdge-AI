services:
  - type: web
    name: footyedge-ai
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    dockerBuildArgs:
      - key: VITE_SUPABASE_URL
        value: ${VITE_SUPABASE_URL}
      - key: VITE_SUPABASE_ANON_KEY
        value: ${VITE_SUPABASE_ANON_KEY}
    envVars:
      - key: PORT
        value: 10000
      - key: RAPIDAPI_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: THESTATSAPI_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "@footyedge_signals"
      - key: TELEGRAM_PREMIUM_CHAT_ID
        value: "@footyedge_premium"
      - key: API_URL
        value: "https://footyedge-ai.onrender.com/api"
